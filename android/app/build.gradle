apply plugin: 'com.android.application'

android {
    namespace "com.flexonix.vidarealfc"
    compileSdk rootProject.ext.compileSdkVersion
    assetPacks = [":premium_pack"] // conteúdo Premium entregue pela Play (Play Asset Delivery)
    defaultConfig {
        applicationId "com.flexonix.vidarealfc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Chave de debug FIXA (a do repositório): sem isso cada build do GitHub gera uma chave nova e o Android recusa atualizar por cima do app já instalado
    signingConfigs {
        debug {
            storeFile file('debug-fixed.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Chave de PUBLICAÇÃO (loja): vem de variáveis de ambiente do CI (segredos do GitHub); nunca fica no repositório.
    // Sem elas, o AAB de release sai sem assinatura (como antes).
    if (System.getenv('RELEASE_KEYSTORE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('RELEASE_KEYSTORE'))
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv('RELEASE_KEYSTORE')) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:7.1.1" // cobrança do Premium (Play Billing)
    implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0" // livro da temporada grátis (Block Store)
    implementation "com.google.android.gms:play-services-ads:23.6.0" // anúncios da versão grátis (AdMob)
    implementation "com.google.android.ump:user-messaging-platform:3.1.0" // consentimento de privacidade (LGPD/GDPR)
    implementation "com.google.android.play:asset-delivery:2.2.2" // download do pacote Premium (Play Asset Delivery)
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
