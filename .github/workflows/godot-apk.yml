name: Jogo 3D (APK Android)

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions (funciona pelo celular)
  push:
    branches: [ccr-52c62cf7-6acwwc, main]
    paths: ['jogo-3d/**', '.github/workflows/godot-apk.yml']

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    # Imagem pronta com Godot 4.3, export templates e Android SDK/JDK
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # A imagem tem Godot, templates, Java e Android SDK, mas em lugares que a Godot não procura
      # por padrão. Aqui localizamos cada um e apontamos para o caminho esperado.
      - name: Preparar templates, Java e Android SDK
        shell: bash
        run: |
          set -x
          TPL=$(find / -type d -name "4.3.stable" -path "*export_templates*" 2>/dev/null | head -1)
          echo "Templates encontrados em: $TPL"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -n "$TPL" ] && [ ! -e "$HOME/.local/share/godot/export_templates/4.3.stable" ]; then
            ln -s "$TPL" "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

          JAVA_BIN=$(readlink -f "$(command -v java)")
          JAVA_DIR=$(dirname "$(dirname "$JAVA_BIN")")
          APKSIGNER=$(find / -type f -name apksigner 2>/dev/null | head -1)
          SDK_DIR=$(dirname "$(dirname "$(dirname "$APKSIGNER")")")
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable" || true

          # Caminhos do Java e do Android SDK gravados nas configurações do editor da Godot 4.3
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          EOF

          # Diagnóstico: o que existe no SDK
          ls "$SDK_DIR" || true
          ls "$SDK_DIR/build-tools" || true

      # Keystore de debug: basta para instalar o APK de teste no celular.
      - name: Criar keystore de debug
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --version
          godot --headless --verbose --path jogo-3d --export-debug "Android" "$GITHUB_WORKSPACE/build/jogo-3d.apk" 2>&1 | tail -n 150
          ls -lh build/

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jogo3d-${{ github.run_number }}
          name: Jogo 3D — build ${{ github.run_number }}
          body: |
            APK de teste do jogo 3D (Godot 4). Baixe `jogo-3d.apk` no celular e instale
            (talvez precise permitir "instalar apps desconhecidos").
          files: build/jogo-3d.apk
          make_latest: true
