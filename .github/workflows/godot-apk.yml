name: Jogo 3D (APK Android)

on:
  workflow_dispatch: # só manual agora: o projeto Godot foi abandonado em favor do libGDX

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Imagem pronta com Godot 4.3, export templates, Java e Android SDK
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # A imagem tem Godot, templates, Java e Android SDK, mas em lugares que a Godot não
      # procura por padrão. Localizamos cada um e apontamos para o caminho esperado.
      - name: Preparar templates, Java e Android SDK
        shell: bash
        run: |
          set -e
          TPL=$(find / -type d -name "4.3.stable" -path "*export_templates*" 2>/dev/null | head -1)
          echo "Templates encontrados em: $TPL"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -n "$TPL" ] && [ ! -e "$HOME/.local/share/godot/export_templates/4.3.stable" ]; then
            ln -s "$TPL" "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

          JAVA_BIN=$(readlink -f "$(command -v java)")
          JAVA_DIR=$(dirname "$(dirname "$JAVA_BIN")")
          APKSIGNER=$(find / -type f -name apksigner 2>/dev/null | head -1)
          SDK_DIR=$(dirname "$(dirname "$(dirname "$APKSIGNER")")")
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # Caminhos do Java e do Android SDK gravados nas configurações do editor da Godot 4.3
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          EOF

      # Keystore de debug: basta para instalar o APK de teste no celular.
      # O caminho e as senhas vão direto no preset de exportação (é onde a Godot valida).
      - name: Criar keystore de debug e configurar o preset
        shell: bash
        run: |
          set -e
          KS="$GITHUB_WORKSPACE/debug.keystore"
          keytool -genkey -v -keystore "$KS" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          sed -i \
            -e "s|^keystore/debug=\"\"|keystore/debug=\"$KS\"|" \
            -e 's|^keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' \
            -e 's|^keystore/debug_password=""|keystore/debug_password="android"|' \
            jogo-3d/export_presets.cfg
          grep '^keystore/debug' jogo-3d/export_presets.cfg

      - name: Exportar APK
        shell: bash
        run: |
          set -o pipefail
          echo "Plataformas Android instaladas:"; ls /usr/lib/android-sdk/platforms || true
          echo "Build-tools instalados:"; ls /usr/lib/android-sdk/build-tools || true
          mkdir -p build
          godot --version
          set +e
          # --install-android-build-template só funciona junto com --export-debug
          timeout 900 godot --headless --verbose --path jogo-3d --install-android-build-template --export-debug "Android" "$GITHUB_WORKSPACE/build/jogo-3d.apk" > export.log 2>&1
          CODE=$?
          set -e
          grep -v "is not exposed" export.log | tail -n 200
          echo "Código de saída da Godot: $CODE"
          # Falha aqui se a exportação não gerou o APK (evita Release vazia)
          test "$CODE" -eq 0
          test -s build/jogo-3d.apk
          ls -lh build/

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jogo3d-${{ github.run_number }}
          name: Jogo 3D — build ${{ github.run_number }}
          body: |
            APK de teste do jogo 3D (Godot 4). Baixe `jogo-3d.apk` no celular e instale
            (talvez precise permitir "instalar apps desconhecidos").
          files: build/jogo-3d.apk
          fail_on_unmatched_files: true
          make_latest: true
