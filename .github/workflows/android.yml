name: Android (APK + AAB)

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions (funciona pelo celular)
    inputs:
      store:
        description: 'Build da loja: exige a compra do Premium (Play Billing). Deixe desmarcado nos APKs de teste.'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # O Android SDK já vem instalado no runner do GitHub; só aceitamos as licenças (a action android-actions/setup-android@v3 quebrou: 'Failed to find package tools')
      - name: Aceitar licenças do Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ENFORCE_BILLING: ${{ inputs.store && '1' || '' }}
      - run: npx cap sync android
      - name: APK de teste (debug)
        run: cd android && ./gradlew assembleDebug
      - name: AAB (release, sem assinatura)
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publicar APK na Release do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Vida-Real-FC.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Vida-Real-FC.aab
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Vida-Real-FC.apk Vida-Real-FC.aab \
            --target "${{ github.sha }}" --prerelease \
            --title "Vida Real FC — build ${{ github.run_number }}" \
            --notes "APK de teste (debug) para instalar no celular + AAB sem assinatura. Gerado automaticamente do commit ${{ github.sha }}."
