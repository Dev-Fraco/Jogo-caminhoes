apply plugin: 'com.android.application'

configurations { natives }

android {
    namespace 'com.exemplo.jogo3d'
    compileSdk 36

    // Mesma chave de assinatura em todos os builds: sem isso o Android não atualiza por cima
    signingConfigs {
        debug {
            storeFile file('keystore/jogo3d-teste.jks')
            storePassword 'jogo3d123'
            keyAlias 'teste'
            keyPassword 'jogo3d123'
        }
    }

    defaultConfig {
        applicationId 'com.exemplo.jogo3d'
        minSdk 24
        targetSdk 36
        // Cada build do GitHub tem um número maior: é isso que permite atualizar por cima
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            // Modelos .obj e texturas ficam em jogo-3d-libgdx/assets e entram no APK
            assets.srcDirs = ['../assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Copia as bibliotecas nativas do libGDX para android/libs, para entrarem no APK
task copyAndroidNatives() {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.all {
    it.dependsOn 'copyAndroidNatives'
}
